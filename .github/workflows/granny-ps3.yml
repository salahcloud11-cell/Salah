name: Granny PS3 controller mod

# Builds the modded Granny APK with full PS3 (DualShock 3) controller support.
# The original APK (183 MB, on Google Drive) is downloaded inside the runner,
# patched with the com.ps3mod touch-mapper, rebuilt, re-signed and published
# as a GitHub Release (too big to commit to git).
#
# Trigger: any push toArena/main touching granny-ps3/** or this file,
#   or manual: Actions tab -> "Granny PS3 controller mod" -> Run workflow.
#
# NOTE: run logs are mirrored to commit comments + annotations because the
# agent sandbox cannot download raw logs (see Report steps).

on:
  push:
    branches: ["arena/**", "main"]
    paths:
      - "granny-ps3/**"
      - ".github/workflows/granny-ps3.yml"
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive file ID of Granny.apk (must be anyone-with-link)"
        default: "1aTRukFGeqdnYP1TWGBALoJ7JX8oCLR3P"
        required: true
        type: string
      expected_bytes:
        description: "Expected size of the original APK in bytes (sanity check)"
        default: "183565031"
        required: true
        type: string
      release_tag:
        description: "Release tag to create/update with the modded APK"
        default: "granny-ps3-latest"
        required: true
        type: string

concurrency:
  group: granny-ps3
  cancel-in-progress: true

permissions:
  contents: write

env:
  DRIVE_FILE_ID: ${{ inputs.drive_file_id || '1aTRukFGeqdnYP1TWGBALoJ7JX8oCLR3P' }}
  EXPECTED_BYTES: ${{ inputs.expected_bytes || '183565031' }}
  RELEASE_TAG: ${{ inputs.release_tag || 'granny-ps3-latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/ps3work
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK (preinstalled on runner)
        run: |
          set -euo pipefail
          mkdir -p "$WORK/logs"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "--- build-tools ---"
            ls "$ANDROID_HOME/build-tools"
            echo "--- platforms ---"
            ls "$ANDROID_HOME/platforms"
            SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ] || [ ! -f "$ANDROID_HOME/platforms/android-34/android.jar" ]; then
              echo "installing build-tools;34.0.0 + platforms;android-34 ..."
              yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
              "$SDKMAN" "platforms;android-34" "build-tools;34.0.0"
            fi
            echo "--- final ---"
            ls "$ANDROID_HOME/build-tools/34.0.0" | head -n 40
            ls -la "$ANDROID_HOME/platforms/android-34/android.jar"
          } 2>&1 | tee "$WORK/logs/sdk.log"

      - name: Download apktool + baksmali
        run: |
          set -euo pipefail
          {
            mkdir -p "$WORK/tools"
            echo "--- apktool (latest) ---"
            APKTOOL_URL="$(curl -sL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
              | jq -r '.assets[] | select(.name | test("^apktool_.*\\.jar$")) | .browser_download_url' | head -n 1)"
            echo "url=$APKTOOL_URL"
            [ -n "$APKTOOL_URL" ] && [ "$APKTOOL_URL" != "null" ]
            curl -sL -o "$WORK/tools/apktool.jar" "$APKTOOL_URL"
            echo "--- baksmali (latest) ---"
            BAKSMALI_URL="$(curl -sL https://api.github.com/repos/JesusFreke/smali/releases/latest \
              | jq -r '[.assets[] | select(.name | test("^baksmali-.*\\.jar$")) | select(.name | test("sources|javadoc") | not) | .browser_download_url] | sort_by(test("fat") | not) | .[0]')"
            echo "url=$BAKSMALI_URL"
            [ -n "$BAKSMALI_URL" ] && [ "$BAKSMALI_URL" != "null" ]
            curl -sL -o "$WORK/tools/baksmali.jar" "$BAKSMALI_URL"
            ls -la "$WORK/tools"
            java -jar "$WORK/tools/apktool.jar" --version || echo "(apktool version check rc=$?)"
            java -jar "$WORK/tools/baksmali.jar" --version || echo "(baksmali version check done)"
          } 2>&1 | tee "$WORK/logs/tools.log"

      - name: Download Granny.apk from Google Drive
        run: |
          set -euo pipefail
          {
            pip install -q gdown
            gdown --fuzzy "https://drive.google.com/uc?id=$DRIVE_FILE_ID&export=download" \
              -O "$WORK/Granny-orig.apk"
            ls -la "$WORK/Granny-orig.apk"
            SIZE="$(stat -c%s "$WORK/Granny-orig.apk")"
            echo "downloaded bytes: $SIZE (expected $EXPECTED_BYTES)"
            MAGIC="$(head -c 2 "$WORK/Granny-orig.apk")"
            if [ "$MAGIC" != "PK" ]; then
              echo "ERROR: download is not a zip/APK (magic=$MAGIC). First bytes:"
              head -c 300 "$WORK/Granny-orig.apk" | cat -v
              exit 1
            fi
            if [ "$SIZE" != "$EXPECTED_BYTES" ]; then
              echo "ERROR: size mismatch, aborting (Drive file changed?)"
              exit 1
            fi
          } 2>&1 | tee "$WORK/logs/download.log"

      - name: Build modded APK
        env:
          APKTOOL_JAR: ${{ github.workspace }}/ps3work/tools/apktool.jar
          BAKSMALI_JAR: ${{ github.workspace }}/ps3work/tools/baksmali.jar
        run: |
          set -euo pipefail
          chmod +x granny-ps3/tools/build.sh
          granny-ps3/tools/build.sh "$WORK/Granny-orig.apk" "$WORK/Granny-PS3-mod.apk" "$WORK/build" 2>&1 | tee "$WORK/logs/build.log"

      - name: Name outputs + checksums
        id: outputs
        run: |
          set -euo pipefail
          cat "$WORK/build/analysis.txt"
          # shellcheck disable=SC1091
          source <(grep -E '^(package|versionName|versionCode|launcherActivity|unity)=' "$WORK/build/analysis.txt" | sed 's/[^a-zA-Z0-9_=.,+-]/_/g')
          SAFE_VER="$(echo "${versionName:-unknown}" | tr -c 'a-zA-Z0-9._+-' '_' | head -c 32)"
          APK_NAME="Granny-${SAFE_VER}-PS3-FULL-CONTROLLER.apk"
          cp "$WORK/Granny-PS3-mod.apk" "$WORK/$APK_NAME"
          {
            echo "file=$APK_NAME"
            echo "size=$(stat -c%s "$WORK/$APK_NAME")"
            echo "md5=$(md5sum "$WORK/$APK_NAME" | cut -d' ' -f1)"
            echo "sha256=$(sha256sum "$WORK/$APK_NAME" | cut -d' ' -f1)"
            echo "versionName=${versionName:-unknown}"
            echo "versionCode=${versionCode:-0}"
          } | tee "$WORK/CHECKSUMS.txt"
          cp "$WORK/build/analysis.txt" "$WORK/analysis.txt"
          {
            echo "apk_name=$APK_NAME"
            echo "version=${versionName:-unknown} (${versionCode:-0})"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: granny-ps3-apk
          path: |
            ${{ github.workspace }}/ps3work/*.apk
            ${{ github.workspace }}/ps3work/CHECKSUMS.txt
            ${{ github.workspace }}/ps3work/analysis.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            cd "$WORK"
            APK_NAME="$(grep '^file=' CHECKSUMS.txt | cut -d= -f2)"
            {
              echo "## Granny + full PS3 (DualShock 3) controller support 🎮"
              echo ""
              echo "Modded APK: the original game from Google Drive + injected"
              echo "\`com.ps3mod\` touch-mapper (left stick = move, right stick = look,"
              echo "all buttons mapped). **Uninstall the original game first**"
              echo "(different signature), then install this APK."
              echo ""
              echo "Full button map + pairing instructions: see"
              echo "\`granny-ps3/PS3-CONTROLLER-GUIDE.md\` in the repo."
              echo ""
              echo "### Build info"
              echo '```'
              cat CHECKSUMS.txt
              echo '```'
            } > release-notes.md
            TAG="$RELEASE_TAG"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "deleting existing release $TAG"
              gh release delete "$TAG" -y
              git push origin ":refs/tags/$TAG" || true
            fi
            gh release create "$TAG" --title "Granny PS3 Full Controller (${{ steps.outputs.outputs.version }})" \
              --notes-file release-notes.md "$APK_NAME" CHECKSUMS.txt analysis.txt
            echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/$TAG" | tee release-url.txt
          } 2>&1 | tee "$WORK/logs/release.log"

      - name: Report success (commit comment + annotation)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## ✅ Granny PS3 build OK"
            echo ""
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -f "$WORK/release-url.txt" ]; then echo "$(cat "$WORK/release-url.txt")"; fi
            echo ""
            echo "### CHECKSUMS.txt"
            echo '```'
            cat "$WORK/CHECKSUMS.txt"
            echo '```'
            echo "### analysis.txt"
            echo '```'
            cat "$WORK/analysis.txt"
            echo '```'
          } > "$WORK/report.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat "$WORK/report.md")" >/dev/null || echo "(commit comment failed)"
          HASHES="$(tr '\n' ' ' < "$WORK/CHECKSUMS.txt" | head -c 800)"
          echo "::notice::GRANNY-PS3-OK $HASHES"

      - name: Report failure (commit comment + annotation)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## ❌ Granny PS3 build FAILED"
            echo ""
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            for f in sdk tools download build release; do
              echo ""
              echo "### $f.log (tail)"
              echo '```'
              tail -c 9000 "$WORK/logs/$f.log" 2>/dev/null || echo "(no $f.log)"
              echo '```'
            done
          } > "$WORK/report.md"
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat "$WORK/report.md")" >/dev/null || echo "(commit comment failed)"
          TAIL40="$(tail -n 40 "$WORK/logs/build.log" 2>/dev/null | head -c 3500)"
          if [ -z "$TAIL40" ]; then
            for f in release download tools sdk; do
              TAIL40="$(tail -n 40 "$WORK/logs/$f.log" 2>/dev/null | head -c 3500)"
              [ -n "$TAIL40" ] && break
            done
          fi
          ESC="$(printf '%s' "$TAIL40" | python3 -c 'import sys; print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))')"
          echo "::error::GRANNY-PS3-FAIL%0A$ESC"
