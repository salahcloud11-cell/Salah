<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c15">
<title>CinemaBox</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080c15;--panel:#111a29;--panel2:#1c2840;--text:#f2f5ff;
  --muted:#a6b3cc;--accent:#9b87ff;--focus:#65f3cc;--danger:#ff8da1;
  --line:#ffffff18;--sidebar:108px;--subtitle:26px
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,Tahoma,sans-serif}
body.ocean{--bg:#07151b;--panel:#102831;--panel2:#1a3843;--accent:#61d8ca}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit;border:0}
button:disabled{opacity:.4;cursor:not-allowed}
button,input,textarea,a{touch-action:manipulation}
button:focus,input:focus,textarea:focus,a:focus,[tabindex="0"]:focus{
  outline:4px solid var(--focus);outline-offset:4px;
  box-shadow:0 0 0 8px #65f3cc20
}
button:focus{position:relative;z-index:2}
button:hover:not(:disabled){filter:brightness(1.13)}
button:active:not(:disabled){transform:scale(.98)}
button,input,textarea,a{scroll-margin:30px}
input,textarea{
  width:100%;padding:12px 15px;min-height:48px;border-radius:12px;
  border:1px solid #ffffff30;background:#070e1b;color:var(--text)
}
input[type=range]{padding:0;min-height:42px;accent-color:var(--focus);direction:ltr}
textarea{min-height:115px;resize:vertical}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2rem,4vw,4.3rem);line-height:1.2}
h2{font-size:1.45rem}h3{font-size:1.1rem}
a{color:var(--focus)}
small,.muted{color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  min-height:48px;padding:11px 19px;border-radius:12px;background:var(--panel2);font-weight:650
}
.primary{background:var(--accent);color:#070c16}
.danger{background:#ff71841c;border:1px solid #ff718444;color:var(--danger)}
.ghost{background:#ffffff0c;border:1px solid var(--line)}
.icon{min-width:48px;font-size:20px;padding:9px 13px}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:grid;gap:18px}
.between{display:flex;align-items:center;justify-content:space-between;gap:18px}
label{display:grid;gap:7px;color:var(--muted);font-size:.9rem}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.full{grid-column:1/-1}
.panel{padding:25px;border:1px solid var(--line);background:var(--panel);border-radius:20px}
.notice{padding:15px 18px;background:#f5c56a0b;border:1px solid #f5c56a35;color:#e9cfa7;border-radius:13px;font-size:13px}
.sidebar{
  position:fixed;right:0;top:0;bottom:0;width:var(--sidebar);z-index:20;
  padding:25px 12px;background:#0b1120;border-left:1px solid var(--line);
  display:flex;flex-direction:column;gap:25px
}
.logo{text-align:center;font-weight:950;font-size:31px;color:var(--focus)}
.logo small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted)}
.nav{display:grid;gap:9px}
.nav-button{
  min-height:69px;border-radius:14px;background:transparent;color:var(--muted);
  display:grid;place-content:center;gap:2px;font-size:11px
}
.nav-button b{font-size:23px;font-weight:400}
.nav-button.active{background:#9b87ff20;color:white;box-shadow:inset -3px 0 var(--accent)}
.app-body{margin-right:var(--sidebar)}
header.topbar{height:88px;padding:18px 4vw;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:26px;font-weight:900;letter-spacing:-1px}
.brand span{color:var(--focus)}
.brand small{font-size:10px;display:block;letter-spacing:1px;font-weight:500;color:var(--muted)}
main{min-height:80vh;padding-bottom:50px}
.content{padding:30px 4vw}
.page{animation:fade .18s ease-out}
.hero{
  position:relative;isolation:isolate;overflow:hidden;min-height:530px;
  padding:55px 5vw;display:flex;align-items:center;gap:45px;
  background:linear-gradient(140deg,#333054,#123442)
}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:.6}
.hero:after{
  content:"";position:absolute;inset:0;z-index:-2;
  background:linear-gradient(270deg,#080c15ee,#080c1570),linear-gradient(0deg,var(--bg),transparent 60%)
}
.hero-copy{flex:1;max-width:750px}
.eyebrow{font-size:12px;letter-spacing:2px;color:var(--focus);margin-bottom:18px}
.hero h1{margin-bottom:17px}
.hero p.description{color:#cad3e6;max-width:640px;margin:24px 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted)}
.tag{font-size:12px;border:1px solid #ffffff30;border-radius:7px;padding:2px 9px}
.rating{color:#ffd584}
.hero-art{width:225px;flex-shrink:0;transform:rotate(-3deg)}
.poster{
  position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:16px;
  background:linear-gradient(150deg,#6859a9,#234a60 60%,#13333c);border:1px solid #ffffff22
}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.poster-fallback{height:100%;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.poster-fallback:before{content:"▶";font-size:60px;color:#ffffff30;margin:auto}
.poster-fallback strong{font-size:1.15rem;line-height:1.5}
.poster-fallback small{font-size:9px;letter-spacing:2px}
.section{margin:28px 0}
.section-title{padding:0 4vw;display:flex;justify-content:space-between;align-items:center}
.section-title h2{margin:0;font-size:1.35rem}
.media-row{display:flex;gap:20px;overflow-x:auto;padding:24px 4vw;scrollbar-width:thin;scrollbar-color:#33405c transparent}
.card{width:175px;flex:0 0 175px;min-width:0;padding:0;background:transparent;text-align:right;border-radius:16px}
.card:focus .poster{border-color:var(--focus)}
.card-title{display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-weight:700;margin-top:11px}
.card small{display:block;font-size:12px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.badge{position:absolute;top:9px;right:9px;background:#080c15d9;padding:3px 8px;border-radius:7px;font-size:10px;z-index:1}
.heart{position:absolute;top:9px;left:9px;color:#ffb7c6;background:#080c15d9;padding:3px 8px;border-radius:7px;z-index:1}
.progress{position:absolute;bottom:0;left:0;right:0;height:4px;background:#ffffff25}
.progress i{height:100%;display:block;background:var(--focus)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:26px 20px;padding:24px 0}
.grid .card{width:100%}
.toolbar{display:flex;gap:15px;flex-wrap:wrap;align-items:end;margin:22px 0}
.toolbar>label{flex:2;min-width:220px}
.empty{text-align:center;padding:45px 25px;border:1px dashed #ffffff30;border-radius:20px;background:#ffffff03}
.empty p{color:var(--muted)}
.empty .actions{justify-content:center}
.episode{display:flex;align-items:center;gap:17px;border:1px solid var(--line);background:var(--panel);padding:17px;border-radius:15px}
.episode .info{flex:1}
.episode .info small{display:block}
.episode-number{color:var(--focus);font-size:22px;min-width:40px;text-align:center}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.toggle{display:flex;align-items:center;justify-content:space-between;text-align:right;width:100%}
.toggle .pill{padding:3px 12px;border-radius:30px;background:#0004;color:var(--focus);font-size:12px}
.remote-layout{display:grid;grid-template-columns:310px 1fr;gap:30px;align-items:start}
.remote{
  direction:ltr;background:linear-gradient(150deg,#26304a,#101724);
  border:1px solid #ffffff28;box-shadow:0 20px 70px #0005;border-radius:48px;
  padding:30px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:13px;max-width:300px;margin:auto
}
.remote .btn{padding:10px 7px;font-size:13px;min-width:0;background:#070e1d;min-height:54px;border:1px solid #ffffff16}
.remote .ok{background:var(--accent);color:#090c17;border-radius:50%}
.remote .wide{grid-column:1/-1}
.remote .gap{pointer-events:none}
.table-wrap{overflow:auto;padding:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:13px 12px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px}
code,kbd{direction:ltr;unicode-bidi:isolate;background:#ffffff0a;padding:3px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;overflow-wrap:anywhere}
.binding-info{padding:16px;border:1px solid #65f3cc33;background:#65f3cc08;border-radius:12px}
.modal-layer{position:fixed;inset:0;z-index:100;background:#000c;display:flex;align-items:center;justify-content:center;padding:25px}
.dialog{width:min(850px,100%);max-height:92dvh;overflow:auto;padding:27px;background:var(--panel);border:1px solid #ffffff30;border-radius:23px;box-shadow:0 30px 120px #000b}
.dialog.wide{width:min(1150px,100%)}
.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:23px}
.dialog-head h2{margin:0}
.choices{display:grid;gap:12px}
.choice{text-align:right;justify-content:space-between}
.test-status{position:sticky;top:0;z-index:4;background:#111e32;padding:15px;border:1px solid #65f3cc40;border-radius:12px;margin-bottom:24px;direction:ltr;text-align:left;font-family:monospace}
.test-row{display:flex;gap:16px;overflow:auto;padding:13px 9px 25px}
.test-card{flex:0 0 145px;min-height:150px;background:linear-gradient(145deg,#54478d,#153a4d);border-radius:15px;font-size:16px}
.test-list{display:grid;gap:13px}
.result-list{display:grid;gap:12px;max-height:330px;overflow:auto;padding:8px}
.result{display:flex;align-items:center;gap:15px;text-align:right}
.result img{width:45px;height:67px;object-fit:cover;border-radius:6px}
#player{position:fixed;inset:0;background:black;z-index:60;direction:ltr}
#video{width:100%;height:100%;object-fit:contain}
#video::cue{font-size:var(--subtitle);background:#000b;color:white}
.player-stage{position:absolute;inset:0;background:transparent;width:100%;height:100%;border-radius:0}
.player-stage:focus{outline:0;box-shadow:inset 0 0 0 3px #65f3cc30}
.player-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:20px;padding:25px 4vw;background:linear-gradient(#000d,transparent);direction:rtl;z-index:3}
.player-title{flex:1;overflow:hidden}
.player-title strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-controls{position:absolute;bottom:0;left:0;right:0;padding:65px 4vw 30px;background:linear-gradient(transparent,#000e 45%);z-index:3}
.seek-row{display:flex;align-items:center;gap:17px;font-size:13px;font-variant-numeric:tabular-nums}
.seek-row input{flex:1}
.player-buttons{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:17px}
.player-buttons .btn{background:#ffffff1b}
.player-buttons .primary{background:var(--focus);color:#081411}
.player-buttons input{width:110px}
.player-spacer{flex:1}
.player-hint{text-align:center;direction:rtl;font-size:11px;color:var(--muted);margin-top:15px}
#playerMessage{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);padding:16px 25px;background:#101927dc;border-radius:14px;z-index:5;direction:rtl;max-width:80%;pointer-events:none}
#player.clean .player-controls,#player.clean .player-top{visibility:hidden;opacity:0;pointer-events:none}
#toasts{position:fixed;bottom:25px;left:25px;display:grid;gap:10px;z-index:300;max-width:min(480px,90vw);pointer-events:none}
.toast{padding:15px 21px;border:1px solid #ffffff30;background:#25334af5;border-radius:14px;box-shadow:0 10px 40px #0007}
.toast.error{border-color:var(--danger)}
.skeleton{height:270px;width:175px;flex-shrink:0;border-radius:15px;background:linear-gradient(90deg,#172133,#25324a,#172133);background-size:200% 100%;animation:loading 1.4s infinite}
@keyframes loading{to{background-position:-200% 0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:1700px){
  body{font-size:20px}:root{--sidebar:130px}
  .nav-button{min-height:86px;font-size:14px}.card{width:220px;flex-basis:220px}
  .hero{min-height:670px}.hero-art{width:285px}.btn{min-height:57px}
}
@media(max-width:1000px){
  .settings-grid{grid-template-columns:1fr}.hero-art{width:170px}
  .remote-layout{grid-template-columns:270px 1fr}.hero{min-height:470px}
}
@media(max-width:650px){
  body{font-size:14px}:root{--sidebar:0px}
  .sidebar{inset:auto 0 0;width:100%;height:calc(73px + env(safe-area-inset-bottom));padding:7px 4px env(safe-area-inset-bottom);border-top:1px solid var(--line)}
  .logo{display:none}.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .nav-button{flex:1 0 62px;min-height:56px;font-size:9px}.nav-button b{font-size:20px}
  .app-body{margin:0}.topbar .muted{display:none}header.topbar{padding:16px 20px;height:80px}
  .brand{font-size:23px}.topbar .btn{font-size:12px;padding:10px 13px}
  main{padding-bottom:100px}.hero{padding:38px 23px;min-height:430px}.hero-art{display:none}
  .hero h1{font-size:2.7rem}.hero .actions{gap:9px}.hero .btn{padding:11px 13px}
  .content{padding:25px 20px}.section-title{padding:0 20px}.media-row{padding:23px 20px;gap:16px}
  .card{width:140px;flex-basis:140px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 17px}
  .field-grid,.remote-layout{grid-template-columns:1fr}.full{grid-column:auto}
  .dialog{padding:20px;max-height:94dvh}.modal-layer{padding:10px}
  .remote{width:275px}.panel{padding:20px}
  .player-controls{padding:45px 15px 20px}.player-top{padding:17px}
  .player-buttons{gap:9px}.player-buttons .btn{padding:9px 12px;min-height:44px}
  .player-buttons input,.player-spacer,.player-hint{display:none}
  .episode{gap:10px;padding:13px}.episode .btn{padding:10px 12px}
  #toasts{bottom:93px;left:15px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo">CB<small>LOCAL CINEMA</small></div>
    <nav id="nav" class="nav" aria-label="التنقل الرئيسي" data-nav-group="sidebar"></nav>
  </aside>
  <div class="app-body">
    <header class="topbar">
      <div class="brand">Cinema<span>Box</span><small>مكتبتك. شاشتك. تحكمك.</small></div>
      <div class="actions">
        <small id="libraryCount" class="muted">مكتبة محلية</small>
        <button id="addFiles" class="btn primary" data-focus="add-files">＋ إضافة فيديو</button>
      </div>
    </header>
    <main id="main">
      <div class="content"><h2>جارٍ فتح المكتبة…</h2></div>
      <div class="media-row" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </main>
  </div>
</div>

<section id="player" hidden role="dialog" aria-modal="true" aria-label="مشغل الفيديو">
  <video id="video" playsinline preload="metadata"></video>
  <button id="playerStage" class="player-stage" data-focus="player-stage" aria-label="مساحة الفيديو: اختيار للتشغيل أو الإيقاف"></button>
  <div class="player-top" data-nav-group="player-top">
    <button id="playerBack" class="btn ghost" data-focus="player-back">← رجوع</button>
    <div class="player-title"><strong id="playerTitle"></strong><small id="playerEpisode"></small></div>
  </div>
  <div id="playerMessage" role="status" hidden></div>
  <div class="player-controls">
    <div class="seek-row" data-nav-group="player-seek">
      <span id="currentTime">00:00</span>
      <input id="seek" type="range" min="0" max="1000" step="5" value="0" aria-label="موضع التشغيل" data-focus="player-seek" data-nav-range>
      <span id="duration">00:00</span>
    </div>
    <div class="player-buttons" data-nav-group="player-buttons">
      <button id="prevEpisode" class="btn" data-focus="player-prev" aria-label="الحلقة السابقة">⏮</button>
      <button id="rewind" class="btn" data-focus="player-rewind" aria-label="رجوع عشر ثوانٍ">−10</button>
      <button id="playPause" class="btn primary" data-focus="player-play" data-initial aria-label="تشغيل">▶</button>
      <button id="forward" class="btn" data-focus="player-forward" aria-label="تقدم عشر ثوانٍ">+10</button>
      <button id="nextEpisode" class="btn" data-focus="player-next" aria-label="الحلقة التالية">⏭</button>
      <button id="mute" class="btn" data-focus="player-mute">صوت</button>
      <input id="volume" type="range" min="0" max="1" step=".05" value="1" aria-label="مستوى الصوت" data-focus="player-volume" data-nav-range>
      <span class="player-spacer"></span>
      <button id="speed" class="btn" data-focus="player-speed">1×</button>
      <button id="subtitles" class="btn" data-focus="player-subtitles">CC</button>
      <button id="fullscreen" class="btn" data-focus="player-fullscreen">⛶</button>
    </div>
    <div class="player-hint">أعلى لإظهار التحكم · Enter اختيار · Back رجوع · تخصيص الأزرار من Remote & Controls</div>
  </div>
</section>

<div id="modalHost"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
(() => {
  const $=(selector,root=document)=>root.querySelector(selector);
  const $$=(selector,root=document)=>[...root.querySelectorAll(selector)];
  const uid=()=>globalThis.crypto?.randomUUID?.()||`cb-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
  const number=(value,min,max,fallback=0)=>Number.isFinite(Number(value))?clamp(Number(value),min,max):fallback;
  const copy=value=>JSON.parse(JSON.stringify(value));
  const TYPES={movie:"فيلم",series:"مسلسل",anime:"أنمي",other:"فيديو"};
  const STORE_PREFIX="CinemaBox.v2.";
  let sequence=0;

function node(tag,className="",text){
    const n=document.createElement(tag);
    if(className)n.className=className;
    if(text!==undefined)n.textContent=text;
    return n;
  }
  function errorMessage(error){
    console.error("CinemaBox",error);
    toast(error?.name==="QuotaExceededError"
      ?"مساحة المتصفح غير كافية. حرّر مساحة ثم أعد المحاولة."
      :error?.message||"تعذر تنفيذ العملية.",true);
  }
  function safe(fn){
    return(...args)=>{
      try{Promise.resolve(fn(...args)).catch(errorMessage);}
      catch(error){errorMessage(error);}
    };
  }
  function listen(target,event,fn){target.addEventListener(event,safe(fn));return target;}
  function button(label,fn,key="",className="btn ghost"){
    const b=node("button",className,label);b.type="button";
    b.dataset.focus=key||`control-${++sequence}`;
    listen(b,"click",fn);
    return b;
  }
  function input(value="",type="text",key=""){
    const n=node("input");n.type=type;n.value=value??"";
    n.dataset.focus=key||`input-${++sequence}`;
    return n;
  }
  function field(label,control){
    const n=node("label");n.append(node("span","",label),control);return n;
  }
  function time(value){
    const s=Math.max(0,Math.floor(Number(value)||0)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
    return(h?`${h}:`:"")+String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  }
  function toast(message,error=false){
    const n=node("div","toast"+(error?" error":""),message);
    $("#toasts").append(n);setTimeout(()=>n.remove(),error?7500:4300);
  }
  function imageURL(value){
    try{
      const url=new URL(value);
      return url.protocol==="https:"&&url.hostname==="image.tmdb.org"?url.href:"";
    }catch{return"";}
  }
  function filePicker(accept,multiple,callback){
    const picker=document.createElement("input");
    picker.type="file";picker.accept=accept;picker.multiple=multiple;picker.hidden=true;
    document.body.append(picker);
    const restore=NavigationManager.snapshot();
    let done=false;
    const finish=()=>{
      if(done)return;done=true;picker.remove();
      setTimeout(()=>NavigationManager.restore(restore),80);
    };
    picker.addEventListener("change",safe(async()=>{
      const files=[...picker.files];finish();
      if(files.length)await callback(files);
    }),{once:true});
    picker.addEventListener("cancel",finish,{once:true});
    picker.click();setTimeout(finish,300000);
  }

/* Event bus and extension registry: future adapters must declare real capabilities. */
  const EventBus=new EventTarget();
  function emit(name,detail){EventBus.dispatchEvent(new CustomEvent(name,{detail}));}
  const ExtensionRegistry={
    adapters:new Map(),
    register(name,adapter){
      if(typeof name!=="string"||!adapter||typeof adapter.isAvailable!=="function")
        throw new Error("واجهة الإضافة غير صالحة.");
      this.adapters.set(name,adapter);emit("extension:registered",{name});
    },
    async available(name){
      const adapter=this.adapters.get(name);
      return !!adapter&&!!(await adapter.isAvailable());
    }
  };

const StorageManager={
    db:null,temporary:false,queue:Promise.resolve(),
    memory:{media:new Map(),assets:new Map(),prefs:new Map()},
    async open(){
      try{
        if(!window.indexedDB)throw new Error("IndexedDB unavailable");
        this.db=await new Promise((resolve,reject)=>{
          const request=indexedDB.open("CinemaBox",1);
          request.onupgradeneeded=()=>{
            for(const name of["media","assets","prefs"])
              if(!request.result.objectStoreNames.contains(name))
                request.result.createObjectStore(name,{keyPath:"id"});
          };
          request.onsuccess=()=>resolve(request.result);
          request.onerror=()=>reject(request.error);
          request.onblocked=()=>toast("أغلق النوافذ الأخرى للتطبيق لإتاحة التخزين.",true);
        });
        this.db.onversionchange=()=>{this.db.close();toast("تغير التخزين في نافذة أخرى. أعد تحميل الصفحة.",true);};
      }catch{this.temporary=true;}
    },
    async get(store,id){
      if(this.temporary)return this.memory[store].get(id);
      return new Promise((resolve,reject)=>{
        const r=this.db.transaction(store).objectStore(store).get(id);
        r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
      });
    },
    async all(store){
      if(this.temporary)return[...this.memory[store].values()];
      return new Promise((resolve,reject)=>{
        const r=this.db.transaction(store).objectStore(store).getAll();
        r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
      });
    },
    transaction(operations){
      const task=this.queue.then(()=>new Promise((resolve,reject)=>{
        if(this.temporary){
          for(const op of operations){
            const store=this.memory[op.store];
            if(op.action==="clear")store.clear();
            else if(op.action==="delete")store.delete(op.id);
            else store.set(op.value.id,op.value);
          }
          resolve();return;
        }
        const tx=this.db.transaction([...new Set(operations.map(x=>x.store))],"readwrite");
        tx.oncomplete=()=>resolve();
        tx.onabort=()=>reject(tx.error||new Error("لم تكتمل معاملة التخزين."));
        tx.onerror=()=>{};
        try{
          for(const op of operations){
            const store=tx.objectStore(op.store);
            if(op.action==="clear")store.clear();
            else if(op.action==="delete")store.delete(op.id);
            else store.put(op.value);
          }
        }catch(error){tx.abort();reject(error);}
      }));
      this.queue=task.catch(()=>{});
      return task;
    }
  };

const AssetManager={
    urls:new Map(),
    async url(id){
      if(!id)return"";
      if(this.urls.has(id))return this.urls.get(id);
      const record=await StorageManager.get("assets",id);
      if(!(record?.blob instanceof Blob))return"";
      if(this.urls.has(id))return this.urls.get(id);
      const url=URL.createObjectURL(record.blob);this.urls.set(id,url);return url;
    },
    revoke(id){const url=this.urls.get(id);if(url)URL.revokeObjectURL(url);this.urls.delete(id);},
    clear(){for(const id of this.urls.keys())this.revoke(id);}
  };

const SoundManager={
    context:null,
    play(kind="move"){
      if(!SettingsManager.value.sound)return;

        const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        this.context||=new AC();
        this.context.resume().catch(()=>{});
        const oscillator=this.context.createOscillator(),gain=this.context.createGain(),now=this.context.currentTime;
        oscillator.frequency.value={move:440,select:660,page:520,play:780}[kind]||440;

        const ops=assets.map(value=>({store:"assets",value}));
        remove.filter(Boolean).forEach(asset=>ops.push({store:"assets",action:"delete",id:asset}));

        await StorageManager.transaction(ops);
        remove.forEach(asset=>AssetManager.revoke(asset));

/*
   * NavigationManager owns scopes, spatial movement, focus memory and recovery.
   * DOM order is only a final fallback, not the D-Pad navigation model.
   */
  const NavigationManager={
    memories:new Map(),groupMemory:new Map(),scheduled:false,ready:false,
    scope(){
      const modal=UIManager.top();
      if(modal)return{key:modal.id,root:modal.layer};
      if(PlayerManager.opened)return{key:"player",root:$("#player")};
      return{key:`page:${UIManager.route.name}:${UIManager.route.id||""}`,root:$("#app")};
    },
    visible(el){
      if(!el||!el.isConnected||el.disabled||el.closest("[hidden],[inert]"))return false;
      const style=getComputedStyle(el),rect=el.getBoundingClientRect();
      return style.display!=="none"&&style.visibility!=="hidden"&&rect.width>0&&rect.height>0;
    },
    elements(root=this.scope().root){
      return $$('button,input:not([type=hidden]),textarea,a[href],[tabindex="0"]',root).filter(el=>this.visible(el));
    },
    key(el){return el?.dataset.focus||el?.id||"";},
    snapshot(){
      const scope=this.scope();
      return{
        scope:scope.key,key:this.key(document.activeElement),element:document.activeElement,
        x:window.scrollX,y:window.scrollY,
        scroll:$$("[data-scroll-key]",scope.root).map(el=>({key:el.dataset.scrollKey,left:el.scrollLeft,top:el.scrollTop}))
      };
    },
    remember(el){
      if(!this.visible(el)||!this.scope().root.contains(el))return;
      const key=this.key(el),scope=this.scope().key;
      if(key)this.memories.set(scope,key);
      const group=el.closest("[data-nav-group]");
      if(group)this.groupMemory.set(`${scope}:${group.dataset.navGroup}`,key);
      emit("focus:changed",{key,label:el.getAttribute("aria-label")||el.textContent.trim().slice(0,80)||key});
    },
    focus(el,scroll=true){
      if(!this.visible(el)||!this.scope().root.contains(el))return false;
      el.focus({preventScroll:true});
      if(document.activeElement!==el)return false;
      if(scroll)el.scrollIntoView({block:"nearest",inline:"nearest",behavior:"auto"});
      this.remember(el);return true;
    },
    restore(snapshot){
      if(!this.ready)return;
      const scope=this.scope();
      if(snapshot&&snapshot.scope===scope.key){
        for(const pos of snapshot.scroll||[]){
          const el=$$("[data-scroll-key]",scope.root).find(x=>x.dataset.scrollKey===pos.key);
          if(el){el.scrollLeft=pos.left;el.scrollTop=pos.top;}
        }
        if(scope.key.startsWith("page:"))window.scrollTo(snapshot.x||0,snapshot.y||0);
        const matching=this.elements().find(el=>this.key(el)===snapshot.key);
        if(this.focus(matching||snapshot.element,false))return;
      }
      this.repair();
    },
    enter(){
      const scope=this.scope(),elements=this.elements();
      const preferred=elements.find(x=>x.hasAttribute("data-initial"));
      this.focus(preferred||elements[0]);
    },
    repair(){
      if(!this.ready)return;
      const scope=this.scope(),active=document.activeElement;
      if(scope.root.contains(active)&&this.visible(active)&&this.elements().includes(active))return;
      const nodes=this.elements(),remembered=this.memories.get(scope.key);
      this.focus(nodes.find(x=>this.key(x)===remembered)||nodes.find(x=>x.hasAttribute("data-initial"))||nodes[0]);
    },
    scheduleRepair(){
      if(this.scheduled)return;this.scheduled=true;
      requestAnimationFrame(()=>{this.scheduled=false;this.repair();});
    },
    horizontalVisible(el){
      const row=el.closest(".media-row,.test-row");
      if(!row)return true;
      const a=el.getBoundingClientRect(),b=row.getBoundingClientRect();
      return a.right>b.left+10&&a.left<b.right-10;
    },
    move(direction){
      const active=document.activeElement;
      if(!this.elements().includes(active)){this.repair();return;}
      if(active.matches("input[type=range]")&&(direction==="left"||direction==="right")){
        const min=Number(active.min||0),max=Number(active.max||100),step=Number(active.step)||1;
        active.value=String(clamp(Number(active.value)+(direction==="right"?step:-step),min,max));
        active.dispatchEvent(new Event("input",{bubbles:true}));
        active.dispatchEvent(new Event("change",{bubbles:true}));
        return;
      }
      const override=active.dataset[`nav${direction[0].toUpperCase()+direction.slice(1)}`];
      if(override){
        const explicit=this.elements().find(el=>this.key(el)===override);
        if(this.focus(explicit))return;
      }
      const r=active.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const horizontal=direction==="left"||direction==="right";
      const row=active.closest(".media-row,.test-row");
      let candidates=this.elements().filter(el=>el!==active);
      // A horizontal row is a navigation lane; its edges never jump into another row.
      if(horizontal&&row)candidates=candidates.filter(el=>row.contains(el));
      if(!horizontal)candidates=candidates.filter(el=>this.horizontalVisible(el));
      let best=null,score=Infinity;
      for(const el of candidates){
        const t=el.getBoundingClientRect(),dx=t.left+t.width/2-cx,dy=t.top+t.height/2-cy;
        const primary=direction==="left"?-dx:direction==="right"?dx:direction==="up"?-dy:dy;
        if(primary<4)continue;
        const overlap=horizontal?t.bottom>r.top+4&&t.top<r.bottom-4:t.right>r.left+4&&t.left<r.right-4;
        const cross=horizontal?Math.abs(dy):Math.abs(dx);
        const gap=horizontal?Math.max(0,Math.abs(dx)-(r.width+t.width)/2):Math.max(0,Math.abs(dy)-(r.height+t.height)/2);
        const value=gap+primary*.15+cross*2+(overlap?0:1100);
        if(value<score){score=value;best=el;}
      }
      if(best&&this.focus(best))SoundManager.play("move");
    },
    select(){
      const active=document.activeElement;
      if(!this.visible(active)||!this.scope().root.contains(active)){this.repair();return;}
      if(active.matches("input,textarea")){
        if(active.type==="range"){this.move("down");return;}
        active.focus();return;
      }
      active.click();SoundManager.play("select");
    },
    tab(backward){
      const nodes=this.elements();if(!nodes.length)return;
      const index=nodes.indexOf(document.activeElement);
      this.focus(nodes[(index+(backward?-1:1)+nodes.length)%nodes.length]);
    },
    init(){
      document.addEventListener("focusin",event=>{
        if(this.scope().root.contains(event.target))this.remember(event.target);
        else this.scheduleRepair();
      });
      new MutationObserver(()=>this.scheduleRepair()).observe(document.body,{
        subtree:true,childList:true,attributes:true,attributeFilter:["hidden","inert","disabled"]
      });
      window.addEventListener("focus",()=>this.scheduleRepair());
    }
  };

const ActionRegistry={
    actions:new Map(),
    register(id,label,execute,{repeat=false,example=""}={}){
      this.actions.set(id,{id,label,execute,repeat,example});
    },
    get(id){return this.actions.get(id);},

        return;
      }
      await action.execute(context);
    }
  };

const DEFAULT_BINDINGS={

      ArrowUp:"nav.up",ArrowDown:"nav.down",ArrowLeft:"nav.left",ArrowRight:"nav.right",

const InputManager={
    config:{mode:"auto",gamepad:true,bindings:copy(DEFAULT_BINDINGS)},
    capture:null,lastRepeat:new Map(),pads:new Map(),frame:0,lastPoll:0,emergency:false,
    async load(){
      let saved;
      try{saved=JSON.parse(localStorage.getItem(STORE_PREFIX+"controls")||"null");}catch{}
      const stored=await StorageManager.get("prefs","controls");
      saved=stored?.value||saved;
      if(saved&&saved.version===2){
        const bindings={keyboard:{},remote:{},gamepad:{}};
        for(const source of Object.keys(bindings)){
          const sourceMap=saved.bindings?.[source];
          if(sourceMap&&typeof sourceMap==="object"){
            for(const [code,action]of Object.entries(sourceMap)){
              if(code.length<100&&ActionRegistry.get(action)&&code!=="F8")bindings[source][code]=action;
            }
          }else bindings[source]=copy(DEFAULT_BINDINGS[source]);
        }
        this.config={mode:["auto","keyboard","remote"].includes(saved.mode)?saved.mode:"auto",gamepad:saved.gamepad!==false,bindings};
      }
    },
    async persist(config){
      const value={version:2,...copy(config)};
      await StorageManager.transaction([{store:"prefs",value:{id:"controls",value}}]);
      this.config=copy(config);
      try{localStorage.setItem(STORE_PREFIX+"controls",JSON.stringify(value));}catch{}
      emit("controls:changed",this.config);
    },
    async bind(source,oldCode,newCode,action){
      const config=copy(this.config);
      if(newCode==="F8")throw new Error("F8 محجوز لشاشة استعادة التحكم.");
      if(oldCode&&oldCode!==newCode)delete config.bindings[source][oldCode];
      config.bindings[source][newCode]=action;
      await this.persist(config);
    },
    async reset(){
      await this.persist({mode:"auto",gamepad:true,bindings:copy(DEFAULT_BINDINGS)});
      toast("استُعيدت خريطة التحكم الافتراضية.");UIManager.refresh();
    },
    canonical(event){
      const legacy={
        19:"MediaPause",23:"Enter",85:"MediaPlayPause",86:"MediaStop",
        87:"MediaTrackNext",88:"MediaTrackPrevious",89:"MediaRewind",90:"MediaFastForward",
        126:"MediaPlay",127:"MediaPause",179:"MediaPlayPause",461:"BrowserBack",10009:"BrowserBack"
      };
      if(event.code&&event.code!=="Unidentified")return event.code;
      if(legacy[event.keyCode])return legacy[event.keyCode];
      const aliases={" ":"Space",Spacebar:"Space",Esc:"Escape",GoBack:"BrowserBack",Back:"BrowserBack",
        VolumeUp:"AudioVolumeUp",VolumeDown:"AudioVolumeDown",VolumeMute:"AudioVolumeMute"};
      if(aliases[event.key])return aliases[event.key];
      if(event.key&&event.key!=="Unidentified")return event.key;
      return`KeyCode:${event.keyCode}`;
    },
    keyboardSource(code){
      if(this.config.mode!=="auto")return this.config.mode;
      return /^(Media|AudioVolume|BrowserBack|ContextMenu|KeyCode:)/.test(code)?"remote":"keyboard";
    },
    isRescue(){return UIManager.dialogs.some(x=>x.rescue);},
    mapping(source,code){
      if(this.isRescue())return DEFAULT_BINDINGS[source]?.[code];
      return this.config.bindings[source]?.[code];
    },
    async dispatch(source,code,{repeat=false,device=""}={}){
      if(this.capture){
        if(performance.now()<this.capture.after)return;
        if(this.capture.source!==source&&!(this.capture.source==="remote"&&source==="keyboard"))return;
        this.capture.finish(code);return;
      }
      const action=this.mapping(source,code);
      emit("input:detected",{source,code,device,action:action||"unassigned"});
      const definition=ActionRegistry.get(action);
      if(!definition)return;
      if(repeat&&!definition.repeat)return;
      const stamp=`${source}:${code}`,now=performance.now();
      if(repeat&&now-(this.lastRepeat.get(stamp)||0)<115)return;
      this.lastRepeat.set(stamp,now);
      await ActionRegistry.run(action,{source,code,device});
    },
    async keyboard(event){
      const code=this.canonical(event);
      if(code==="F8"){
        event.preventDefault();event.stopPropagation();
        if(!event.repeat){
          if(this.capture)this.capture.cancel();
          UIManager.rescue();
        }
        return;
      }
      if(this.capture){
        event.preventDefault();event.stopPropagation();
        if(event.repeat)return;
        if(code==="Escape"){this.capture.cancel();return;}
        const source=this.capture.source==="gamepad"?"keyboard":this.capture.source;
        await this.dispatch(source,code);return;
      }
      const source=this.keyboardSource(code),action=this.mapping(source,code);
      const active=document.activeElement,editing=active?.matches("input:not([type=range]),textarea");
      // Text entry stays native. Direction actions only leave single-line fields vertically.
      if(editing){
        if(code==="Tab"){event.preventDefault();NavigationManager.tab(event.shiftKey);return;}
        if(code==="Escape"){event.preventDefault();await UIManager.back();return;}
        if((action==="nav.up"||action==="nav.down")&&(active.tagName!=="TEXTAREA"||event.altKey)){
          event.preventDefault();await this.dispatch(source,code,{repeat:event.repeat});return;
        }
        if(action==="select"&&active.tagName!=="TEXTAREA"){
          event.preventDefault();NavigationManager.move("down");return;
        }
        return;
      }
      if(code==="Tab"){event.preventDefault();NavigationManager.tab(event.shiftKey);return;}
      if(!action)return;
      event.preventDefault();event.stopPropagation();
      await this.dispatch(source,code,{repeat:event.repeat});
    },
    captureInput(source){
      return new Promise(resolve=>{
        const body=node("div","stack");
        body.append(node("p","","اضغط الزر المطلوب الآن."),
          node("p","muted",source==="gamepad"
            ?"اضغط زرًا أو حرّك محورًا ثم اتركه. قد تحتاج إلى تنشيط Gamepad بزر أولًا."
            :"يمكن تسجيل الأسهم وEnter ومفاتيح الوسائط. Escape للإلغاء وF8 للاستعادة؛ بعض أزرار النظام لا تصل إلى المتصفح."));
        const cancel=button("إلغاء التسجيل",()=>finish(null),"capture-cancel");
        body.append(cancel);
        let dialog,finished=false;
        const finish=code=>{
          if(finished)return;finished=true;
          this.capture=null;
          if(UIManager.top()===dialog)UIManager.close(dialog);
          resolve(code);
        };
        dialog=UIManager.modal("تسجيل زر تحكم",body,{onClose:()=>finish(null)});
        this.capture={source,after:performance.now()+300,finish,cancel:()=>finish(null)};
      });
    },
    poll(timestamp){
      this.frame=requestAnimationFrame(t=>this.poll(t));
      if(document.hidden||timestamp-this.lastPoll<25)return;
      this.lastPoll=timestamp;
      if(!this.config.gamepad&&this.capture?.source!=="gamepad")return;
      if(!navigator.getGamepads)return;
      let pads;try{pads=navigator.getGamepads();}catch{return;}
      const connected=new Set();
      for(const pad of pads){
        if(!pad)continue;connected.add(pad.index);
        const previous=this.pads.get(pad.index)||new Map(),current=new Set();
        pad.buttons.forEach((b,index)=>{if(b.pressed||b.value>.65)current.add(`Button:${index}`);});
        pad.axes.forEach((value,index)=>{
          const positive=`Axis:${index}:+`,negative=`Axis:${index}:-`;
          if(value>(previous.has(positive)?.35:.6))current.add(positive);
          if(value<-(previous.has(negative)?.35:.6))current.add(negative);
        });
        const next=new Map();
        for(const code of current){
          const held=previous.get(code);
          if(!held){
            next.set(code,{since:timestamp,last:timestamp});
            safe(()=>this.dispatch("gamepad",code,{device:pad.id}))();
          }else{
            next.set(code,held);
            if(!this.capture&&timestamp-held.since>420&&timestamp-held.last>125){
              held.last=timestamp;
              safe(()=>this.dispatch("gamepad",code,{repeat:true,device:pad.id}))();
            }
          }
        }
        this.pads.set(pad.index,next);
      }
      for(const id of this.pads.keys())if(!connected.has(id))this.pads.delete(id);
    },
    init(){
      document.addEventListener("keydown",safe(event=>this.keyboard(event)),true);
      document.addEventListener("keyup",event=>{
        const code=this.canonical(event);this.lastRepeat.delete(`${this.keyboardSource(code)}:${code}`);
      },true);
      window.addEventListener("blur",()=>{this.lastRepeat.clear();this.pads.clear();});
      window.addEventListener("gamepadconnected",event=>toast(`Gamepad متصل: ${event.gamepad.id}`));
      window.addEventListener("gamepaddisconnected",()=>toast("انقطع اتصال Gamepad؛ يمكنك استخدام الريموت أو لوحة المفاتيح."));
      this.frame=requestAnimationFrame(t=>this.poll(t));
    }
  };

const PlayerManager={
    id:null,opened:false,loaded:false,token:0,returnFocus:null,hideTimer:0,
    lastSave:0,subtitleURL:"",track:null,opening:false,
    get video(){return $("#video");},
    async open(id,restart=false){
      if(this.opening)return;

      if(!item.videoAsset){toast("اربط ملف فيديو من جهازك أولًا.");LibraryManager.attach(id);return;}

        const source=await AssetManager.url(item.videoAsset);
        if(!source){toast("الملف المحلي غير متاح. أعد ربطه.",true);LibraryManager.attach(id);return;}
        if(this.opened)await this.save(true);else this.returnFocus=NavigationManager.snapshot();
        const token=++this.token;
        this.loaded=false;this.video.pause();this.video.removeAttribute("src");this.video.load();this.clearTrack();
        this.id=id;this.opened=true;this.lastSave=0;
        this.startAt=restart||item.completed?0:item.position||0;

        $("#seek").value="0";$("#currentTime").textContent="00:00";$("#duration").textContent="00:00";
        this.video.playbackRate=SettingsManager.value.speed;$("#speed").textContent=`${SettingsManager.value.speed}×`;
        this.updateEpisodes();this.message("جارٍ فتح الفيديو…");

        NavigationManager.focus($("#playPause"));
        if(item.subtitleAsset)safe(()=>this.loadSubtitle(item.subtitleAsset,token))();
        try{await this.video.play();}catch(error){
          if(error.name!=="AbortError")this.message("اضغط تشغيل. قد يمنع المتصفح التشغيل التلقائي.");
        }
        SoundManager.play("play");this.show(false);
      }finally{this.opening=false;}
    },
    async close(){
      if(!this.opened)return;
      ++this.token;
      try{await this.save(true);}catch(error){errorMessage(error);}
      this.loaded=false;this.video.pause();clearTimeout(this.hideTimer);
      if(document.fullscreenElement)try{await document.exitFullscreen();}catch{}
      this.video.removeAttribute("src");this.video.load();this.clearTrack();
      this.opened=false;this.id=null;$("#player").hidden=true;
      document.body.style.overflow="";UIManager.syncScopes();UIManager.render();

    },
    message(text){

    },
    show(focus=false){
      $("#player").classList.remove("clean");clearTimeout(this.hideTimer);
      if(focus)NavigationManager.focus($("#playPause"),false);
      if(!this.video.paused)this.hideTimer=setTimeout(()=>{
        if(!this.opened||UIManager.top()||this.video.paused)return;
        const active=document.activeElement;
        // Never hide a seek/volume field while it is being adjusted.

    },
    navigate(direction){

        if(direction==="left"||direction==="right"){this.seek(direction==="left"?-10:10);return;}

    },
    async toggle(){

      if(this.video.paused){
        try{await this.video.play();}catch{this.message("تعذر التشغيل؛ تحقق من دعم ترميز الفيديو والصوت.");}
      }else this.video.pause();

    seek(delta){

    volume(delta){
      if(!this.opened){toast("التحكم بمستوى صوت الفيديو متاح أثناء التشغيل، وليس بصوت نظام الجهاز.");return;}

    async fullscreen(){

        if(document.fullscreenElement)await document.exitFullscreen();

        else if(this.video.webkitEnterFullscreen)this.video.webkitEnterFullscreen();
        else this.message("ملء الشاشة غير مدعوم هنا.");
      }catch{this.message("رفض المتصفح ملء الشاشة؛ جرّب الزر مباشرة.");}
    },
    updateEpisodes(){
      const item=LibraryManager.get(this.id),list=LibraryManager.episodes(item),index=list.findIndex(x=>x.id===this.id);

    async adjacent(step){
      if(!this.opened)return;

      if(!LibraryManager.series(item)||!list[index+step]){this.message("لا توجد حلقة أخرى.");return;}
      const next=list[index+step];
      if(!next.videoAsset){this.message("الحلقة التالية غير مرتبطة بملف فيديو.");this.show(true);return;}
      await this.open(next.id);
    },
    async save(force=false){
      if(!this.opened||!this.loaded||!this.id)return;
      const v=this.video,now=Date.now();
      if(!force&&now-this.lastSave<5000)return;
      if(!Number.isFinite(v.duration)||v.duration<=0)return;
      this.lastSave=now;

    clearTrack(){

      document.addEventListener("visibilitychange",()=>{if(document.hidden)this.save(true).catch(()=>{});});
      window.addEventListener("pagehide",()=>{this.save(true).catch(()=>{});});
    }
  };

const MetadataManager={
    async request(path,params={}){
      const key=SettingsManager.value.apiKey.trim();
      if(!key)throw new Error("أضف مفتاح TMDB في الإعدادات أولًا.");
      const url=new URL("https://api.themoviedb.org/3"+path),headers={Accept:"application/json"};
      url.searchParams.set("language","ar-SA");
      for(const[k,v]of Object.entries(params))url.searchParams.set(k,v);
      if(key.includes("."))headers.Authorization=`Bearer ${key}`;else url.searchParams.set("api_key",key);
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),18000);
      try{
        const response=await fetch(url,{headers,signal:controller.signal});
        if(!response.ok)throw new Error(`تعذر جلب TMDB (${response.status}). تحقق من المفتاح وحدود الاستخدام.`);
        return await response.json();
      }catch(error){
        if(error.name==="AbortError")throw new Error("انتهت مهلة TMDB.");
        if(error instanceof TypeError)throw new Error("تعذر الاتصال. تحقق من الإنترنت؛ قد يقيّد المتصفح الاتصال من file://.");

  };

    results(route){

      while(UIManager.top())UIManager.close();
      if(PlayerManager.opened)await PlayerManager.close();
      UIManager.navigate("home");
    },{example:"فتح الصفحة الرئيسية."});
    ActionRegistry.register("menu","Menu",()=>UIManager.menu(),{example:"فتح القائمة السريعة التي تحتوي على التحكم والإعدادات."});
    ActionRegistry.register("controls","Remote & Controls",async()=>{
      while(UIManager.top())UIManager.close();
      if(PlayerManager.opened)await PlayerManager.close();
      UIManager.navigate("controls");
    },{example:"فتح صفحة تخصيص التحكم."});
    ActionRegistry.register("none","No Action",()=>{}, {example:"تجاهل هذا الزر دون تنفيذ وظيفة."});
  }

/*
   * Public extension points contain no fake backend implementation.
   * Future modules may subscribe to events, register actions, or supply adapters:
   * cast, dlna, nas, smb, sync, profiles, parental-controls, history,
   * watch-party, subtitle-provider, audio-tracks, trailers, collections,
   * smart-playlists, recommendations, statistics, backup-importer, themes,
   * layouts, plugins, pwa, native-wrapper.
   */
  window.CinemaBox=Object.freeze({
    version:"2.0",
    managers:Object.freeze({
      NavigationManager,InputManager,PlayerManager,LibraryManager,MetadataManager,
      StorageManager,SettingsManager,UIManager,SearchManager
    }),
    actions:ActionRegistry,events:EventBus,extensions:ExtensionRegistry,
    capabilities:()=>({
      indexedDB:!StorageManager.temporary,
      gamepad:typeof navigator.getGamepads==="function",
      fullscreen:!!document.fullscreenEnabled,
      persistentStorage:!!navigator.storage?.persist,
      secureContext:window.isSecureContext,
      backend:false
    })
  });

async function boot(){
    $("#addFiles").disabled=true;
    registerActions();UIManager.init();NavigationManager.init();
    await StorageManager.open();
    await SettingsManager.load();
    await LibraryManager.load();
    await InputManager.load();
    PlayerManager.init();InputManager.init();
    UIManager.ready=true;NavigationManager.ready=true;
    $("#addFiles").disabled=false;UIManager.render();NavigationManager.enter();
    if(!LibraryManager.items.length)toast("أضف ملفاتك أو جرّب العرض التجريبي. إعدادات التحكم متاحة من Settings → Remote & Controls.");
  }

boot().catch(error=>{
    errorMessage(error);
    const box=node("div","content stack");
    box.append(node("h2","","تعذر فتح التطبيق"),
      node("p","muted","قد يكون التخزين محظورًا. جرّب نافذة عادية أو متصفحًا آخر."),
      button("إعادة المحاولة",()=>location.reload(),"reload","btn primary"));
    $("#main").replaceChildren(box);
    const retry=$("button",box);retry.focus();
  });
})();
</script>

<script>
(() => {
  "use strict";

/*
   * Append after the original CinemaBox script.
   * This patch targets CinemaBox version 2 from the previous answer.
   */
  const CB = window.CinemaBox;
  if (!CB || window.__CinemaBoxControlFixInstalled) return;
  window.__CinemaBoxControlFixInstalled = true;

const {
    NavigationManager: Nav,
    InputManager: Input,
    UIManager: UI,
    PlayerManager: Player,
    LibraryManager: Library,
    MetadataManager: Metadata,
    StorageManager: Storage
  } = CB.managers;

const Actions = CB.actions;
  const Events = CB.events;
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) =>
    [...root.querySelectorAll(selector)];

const types = {
    movie: "فيلم",
    series: "مسلسل",
    anime: "أنمي",
    other: "فيديو"
  };

const makeId = () =>
    globalThis.crypto?.randomUUID?.() ||
    `fix-${Date.now()}-${Math.random().toString(36).slice(2)}`;

function element(tag, className = "", text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

function notify(message, error = false) {
    const node = element("div", "toast" + (error ? " error" : ""), message);
    $("#toasts").append(node);
    setTimeout(() => node.remove(), error ? 7500 : 4500);
  }

function fail(error) {
    console.error("CinemaBox correction:", error);
    notify(
      error?.name === "QuotaExceededError"
        ? "مساحة التخزين غير كافية. لم يتم حفظ الصورة أو التغييرات."
        : error?.message || "تعذر إكمال العملية.",
      true
    );
  }

function listen(node, event, callback) {
    node.addEventListener(event, (...args) => {
      try {
        Promise.resolve(callback(...args)).catch(fail);
      } catch (error) {
        fail(error);
      }
    });
  }

function button(label, callback, key, className = "btn ghost") {
    const node = element("button", className, label);
    node.type = "button";
    node.dataset.focus = key || makeId();
    listen(node, "click", callback);
    return node;
  }

function field(label, control) {
    const wrapper = element("label");
    wrapper.append(element("span", "", label), control);
    return wrapper;
  }

function input(value, type, key) {
    const node = element("input");
    node.type = type || "text";
    node.value = value ?? "";
    node.dataset.focus = key || makeId();
    return node;
  }

function allowedRemoteImage(value) {
    try {
      const url = new URL(value);
      return url.protocol === "https:" &&
        url.hostname === "image.tmdb.org"
        ? url.href
        : "";
    } catch {
      return "";
    }
  }

/*
   * 1. Native file dialogs must not cause aggressive focus recovery.
   */
  let pickerDeadline = 0;
  let editingElement = null;

const originalRepair = Nav.repair.bind(Nav);

Nav.repair = function () {
    if (performance.now() < pickerDeadline) return;

if (
      editingElement &&
      (!editingElement.isConnected ||
        !this.scope().root.contains(editingElement))
    ) {
      leaveEditing();
    }

originalRepair();
  };

function leaveEditing() {
    if (editingElement) {
      editingElement.classList.remove("cb-editing");
    }
    editingElement = null;
  }

function enterEditing(node) {
    leaveEditing();
    editingElement = node;
    node.classList.add("cb-editing");
    node.focus({ preventScroll: true });

notify(
      "وضع الكتابة: الأسهم لتحريك المؤشر. Back أو Escape لإنهاء الكتابة والعودة للتنقل."
    );
  }

document.addEventListener("focusin", event => {
    if (editingElement && event.target !== editingElement) {
      leaveEditing();
    }
  });

document.addEventListener("click", event => {
    const target = event.target;

if (
      target instanceof HTMLInputElement &&
      target.type === "file"
    ) {
      pickerDeadline = performance.now() + 120000;
    }
  }, true);

document.addEventListener("change", event => {
    if (event.target?.matches?.('input[type="file"]')) {
      pickerDeadline = 0;
    }
  }, true);

document.addEventListener("cancel", event => {
    if (event.target?.matches?.('input[type="file"]')) {
      pickerDeadline = 0;
      Nav.scheduleRepair();
    }
  }, true);

window.addEventListener("focus", () => {
    setTimeout(() => {
      pickerDeadline = 0;
      Nav.scheduleRepair();
    }, 300);
  });

/*
   * 2. Normalize remote keys before selecting the input map.
   * Some TV browsers report keyCode but an unusable code/key.
   */
  const originalCanonical = Input.canonical.bind(Input);

Input.canonical = function (event) {
    const code = event.code || "";
    const key = event.key || "";
    const legacy = Number(event.keyCode || event.which || 0);

const keyAliases = {
      DPAD_UP: "ArrowUp",
      DPAD_DOWN: "ArrowDown",
      DPAD_LEFT: "ArrowLeft",
      DPAD_RIGHT: "ArrowRight",
      DPAD_CENTER: "Enter",
      DPadUp: "ArrowUp",
      DPadDown: "ArrowDown",
      DPadLeft: "ArrowLeft",
      DPadRight: "ArrowRight",
      Select: "Enter",
      Accept: "Enter",
      OK: "Enter",
      Back: "BrowserBack",
      GoBack: "BrowserBack",
      Return: "Enter",
      Esc: "Escape",
      " ": "Space"
    };

if (keyAliases[key]) return keyAliases[key];

const remoteCodes = {
      23: "Enter",
      461: "BrowserBack",
      10009: "BrowserBack",
      415: "MediaPlay",
      19: "MediaPause",
      413: "MediaStop",
      412: "MediaRewind",
      417: "MediaFastForward",
      10252: "MediaPlayPause"
    };

const genuineKeyCode =
      /^(Key[A-Z]|Digit[0-9]|Numpad[0-9])$/.test(code);

if (remoteCodes[legacy] && !genuineKeyCode) {
      return remoteCodes[legacy];
    }

if (!code || code === "Unidentified") {
      const arrows = {
        37: "ArrowLeft",
        38: "ArrowUp",
        39: "ArrowRight",
        40: "ArrowDown",
        13: "Enter",
        27: "Escape"
      };

if (arrows[legacy]) return arrows[legacy];
    }

return originalCanonical(event);
  };

/*
   * 3. Native inputs:
   * - File input: OK opens the actual browser picker synchronously.
   * - Text fields: navigation mode by default.
   * - OK enters text-edit mode.
   * - Back first leaves edit mode instead of closing the editor.
   */
  const originalKeyboard = Input.keyboard.bind(Input);

Input.keyboard = async function (event) {
    const code = this.canonical(event);

if (code === "F8" || this.capture) {
      return originalKeyboard(event);
    }

const active = document.activeElement;
    const source = this.keyboardSource(code);
    const action = this.mapping(source, code);

const isFile = active?.matches?.('input[type="file"]');

const isText = active?.matches?.(
      'textarea,input:not([type="range"]):not([type="file"]):not([type="checkbox"]):not([type="radio"])'
    );

const cancel =
      action === "back" ||
      code === "Escape" ||
      code === "BrowserBack";

if (isFile) {
      if (action === "select" || code === "Space") {
        event.preventDefault();
        event.stopPropagation();

if (!event.repeat) {
          pickerDeadline = performance.now() + 120000;
          active.click();
        }

return;
      }

if (action?.startsWith("nav.")) {
        event.preventDefault();
        event.stopPropagation();

await this.dispatch(source, code, {
          repeat: event.repeat
        });

return;
      }
    }

if (isText) {
      if (code === "Tab") {
        event.preventDefault();
        leaveEditing();
        Nav.tab(event.shiftKey);
        return;
      }

if (editingElement === active) {
        if (cancel && code !== "Backspace") {
          event.preventDefault();
          event.stopPropagation();
          leaveEditing();
          Nav.focus(active, false);
          notify("تم الرجوع إلى وضع التنقل.");
        }

return;
      }

if (cancel && code !== "Backspace") {
        event.preventDefault();
        event.stopPropagation();
        await UI.back();
        return;
      }

if (action?.startsWith("nav.")) {
        event.preventDefault();
        event.stopPropagation();

await this.dispatch(source, code, {
          repeat: event.repeat
        });

return;
      }

if (action === "select") {
        event.preventDefault();
        event.stopPropagation();

if (!event.repeat) enterEditing(active);
        return;
      }

/*
       * Typing directly is allowed without an extra OK press.
       * A character bound to an app command stays text inside a field.
       */
      if (
        event.key?.length === 1 &&
        !event.ctrlKey &&
        !event.metaKey &&
        !event.altKey
      ) {
        leaveEditing();
        editingElement = active;
        active.classList.add("cb-editing");
      }

return;
    }

return originalKeyboard(event);
  };

const originalSelect = Nav.select.bind(Nav);

Nav.select = function () {
    const active = document.activeElement;

if (active?.matches?.('input[type="file"]')) {
      pickerDeadline = performance.now() + 120000;
      active.click();
      return;
    }

if (
      active?.matches?.(
        'textarea,input:not([type="range"]):not([type="file"])'
      )
    ) {
      enterEditing(active);
      return;
    }

originalSelect();
  };

/*
   * 4. Scroll the actual dialog/row when moving focus.
   * Directional navigation can now reach controls below long textareas.
   */
  const originalFocus = Nav.focus.bind(Nav);

Nav.focus = function (target, scroll = true) {
    const success = originalFocus(target, false);

if (!success || !scroll) return success;

const dialog = target.closest(".dialog");

if (dialog) {
      const bounds = dialog.getBoundingClientRect();
      const rect = target.getBoundingClientRect();
      const margin = 25;

if (rect.bottom > bounds.bottom - margin) {
        dialog.scrollTop += rect.bottom - bounds.bottom + margin;
      }

if (rect.top < bounds.top + margin) {
        dialog.scrollTop -= bounds.top + margin - rect.top;
      }

const horizontal = target.closest(
        ".test-row,.media-row,.table-wrap"
      );

if (horizontal && dialog.contains(horizontal)) {
        target.scrollIntoView({
          block: "nearest",
          inline: "nearest",
          behavior: "auto"
        });
      }
    } else {
      target.scrollIntoView({
        block: "nearest",
        inline: "nearest",
        behavior: "auto"
      });
    }

return true;
  };

const originalMove = Nav.move.bind(Nav);

Nav.move = function (direction) {
    const before = document.activeElement;

leaveEditing();
    originalMove(direction);

/*
     * Fallback for irregular grids and wide full-row controls:
     * move through the dialog's focus order only when spatial search
     * could not find a vertical candidate.
     */
    if (
      document.activeElement === before &&
      before?.closest?.(".dialog") &&
      (direction === "up" || direction === "down")
    ) {
      const list = this.elements();
      const index = list.indexOf(before);
      const next = list[index + (direction === "down" ? 1 : -1)];
      if (next) this.focus(next);
    }
  };

/*
   * Gamepad-based OK may not grant native file-picker activation.
   * The actual file input remains visible and usable by touch/keyboard.
   */
  function nativePickerHint() {
    notify(
      "اختر صورة من نافذة الملفات. إذا لم تفتح باستخدام Gamepad، استخدم OK من الريموت أو اضغط حقل اختيار الملف؛ المتصفح قد يشترط تفاعلًا مباشرًا."
    );
  }

/*
   * 5. Replace the editor with a fully navigable version:
   * visible native file inputs, local previews and atomic save.
   */
  UI.edit = function (id) {
    const original = Library.get(id);
    if (!original) return;

const form = element("form", "cb-editor");
    const intro = element(
      "div",
      "cb-editor-help",
      "الأسهم للتنقل بين جميع الحقول والأزرار، حتى أسفل الصفحة. OK للكتابة داخل الحقل، وBack لإنهاء الكتابة. اختر الصورة ثم اضغط «حفظ التغييرات»."
    );

form.append(intro);

const grid = element("div", "field-grid");

const fields = {
      title: input(original.title, "text", "fixed-title"),
      seriesTitle: input(original.seriesTitle, "text", "fixed-series"),
      season: input(original.season ?? 1, "number", "fixed-season"),
      episode: input(original.episode ?? 1, "number", "fixed-episode"),
      year: input(original.year, "number", "fixed-year"),
      genre: input(original.genre, "text", "fixed-genre"),
      rating: input(original.rating || "", "number", "fixed-rating"),
      description: element("textarea")
    };

fields.title.required = true;
    fields.title.maxLength = 240;
    fields.title.dataset.initial = "";

fields.seriesTitle.maxLength = 240;
    fields.season.min = "0";
    fields.season.max = "999";
    fields.episode.min = "1";
    fields.episode.max = "9999";
    fields.year.min = "1800";
    fields.year.max = "2200";
    fields.rating.min = "0";
    fields.rating.max = "10";
    fields.rating.step = ".1";

fields.description.value = original.description || "";
    fields.description.maxLength = 12000;
    fields.description.dataset.focus = "fixed-description";

let contentType = original.type;
    let dialog;
    let disposed = false;
    let saving = false;

const pending = {
      poster: null,
      backdrop: null
    };

const removed = {
      poster: false,
      backdrop: false
    };

const remote = {
      poster: allowedRemoteImage(original.posterUrl),
      backdrop: allowedRemoteImage(original.backdropUrl)
    };

const urls = new Set();
    const versions = { poster: 0, backdrop: 0 };
    const imageViews = {};

const series = element("div", "field-grid full");

const typeButton = button(
      `النوع: ${types[contentType]}`,
      () => UI.choose(
        "نوع المحتوى",
        Object.entries(types),
        contentType,
        value => {
          contentType = value;
          updateType();
        }
      ),
      "fixed-type"
    );

function updateType() {
      typeButton.textContent = `النوع: ${types[contentType]}`;

series.hidden = !["series", "anime"].includes(contentType);

for (const control of [
        fields.seriesTitle,
        fields.season,
        fields.episode
      ]) {
        control.disabled = series.hidden;
      }

fields.seriesTitle.required = !series.hidden;
    }

grid.append(
      field("العنوان", fields.title),
      typeButton
    );

series.append(
      field("اسم المسلسل / الأنمي الموحد", fields.seriesTitle),
      field("رقم الموسم", fields.season),
      field("رقم الحلقة", fields.episode)
    );

grid.append(
      series,
      field("سنة الإصدار", fields.year),
      field("Genre", fields.genre),
      field("التقييم من 10", fields.rating)
    );

const description = field("الوصف", fields.description);
    description.className = "full";

grid.append(description);
    form.append(grid);
    updateType();

const imageGrid = element("div", "cb-editor-images");

function objectURL(blob) {
      const url = URL.createObjectURL(blob);
      urls.add(url);
      return url;
    }

async function displayStored(kind) {
      const version = versions[kind];
      const view = imageViews[kind];

let source = remote[kind];
      const asset = original[kind + "Asset"];

if (asset) {
        try {
          const stored = await Storage.get("assets", asset);

if (
            disposed ||
            version !== versions[kind] ||
            pending[kind] ||
            removed[kind]
          ) return;

if (stored?.blob instanceof Blob) {
            source = objectURL(stored.blob);
          }
        } catch {
          view.status.textContent =
            "تعذر قراءة الصورة القديمة. يمكنك اختيار صورة جديدة.";
        }
      }

if (disposed || version !== versions[kind]) return;

if (source) {
        view.preview.src = source;
        view.preview.hidden = false;
      }
    }

async function verifyImage(file) {
      if (!file.size) throw new Error("ملف الصورة فارغ.");

if (file.size > 25 * 1024 * 1024) {
        throw new Error("اختر صورة أصغر من 25 MB.");
      }

/*
       * Android providers sometimes leave MIME type empty.
       * Validate using both the name and actual browser decoding.
       */
      const extensionOK =
        /\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(file.name);

const mimeOK =
        /^image\/(jpeg|png|webp|gif|avif|bmp|x-ms-bmp)$/i.test(file.type);

if (!extensionOK && !mimeOK) {
        throw new Error(
          "اختر JPG أو PNG أو WebP أو GIF أو AVIF. صور HEIC قد تحتاج إلى تحويل قبل استخدامها."
        );
      }

const url = objectURL(file);

await new Promise((resolve, reject) => {
        const image = new Image();
        const timer = setTimeout(() => {
          image.onload = null;
          image.onerror = null;
          reject(new Error("استغرق فتح الصورة وقتًا طويلًا. جرّب صورة أصغر."));
        }, 15000);

image.onload = () => {
          clearTimeout(timer);

if (!image.naturalWidth || !image.naturalHeight) {
            reject(new Error("لا يمكن قراءة أبعاد الصورة."));
            return;
          }

resolve();
        };

image.onerror = () => {
          clearTimeout(timer);
          reject(new Error("المتصفح لا يستطيع قراءة هذه الصورة. جرّب JPG أو PNG."));
        };

image.src = url;
      });

return url;
    }

for (const kind of ["poster", "backdrop"]) {
      const box = element("section", "cb-image-box");
      const title = kind === "poster"
        ? "صورة البوستر"
        : "صورة الخلفية";
